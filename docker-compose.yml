services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: watchfacts-bot:local
    container_name: watchfacts-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      HEADLESS: "${HEADLESS:-true}"
      ENABLE_CRAWL4AI: "${ENABLE_CRAWL4AI:-true}"
      WATCHFACTS_URL: "${WATCHFACTS_URL:-https://watchfacts.com/simon-match-making}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    shm_size: "1gb"
    init: true
    command: ["python", "-m", "app.main"]

  llama-cpp:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    container_name: watchfacts-llama-cpp
    profiles:
      - llm
    restart: unless-stopped
    ports:
      - "${LLAMA_CPP_PORT:-8080}:8080"
    volumes:
      - "${LLAMA_CPP_MODELS_DIR:-./models}:/models:ro"
    command:
      - --model
      - "/models/${LLAMA_CPP_MODEL_FILE:-gemma-4-E2B-it-Q8_0.gguf}"
      - --ctx-size
      - "${LLAMA_CPP_CTX_SIZE:-4096}"
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -n
      - "${LLAMA_CPP_PREDICT:-256}"
