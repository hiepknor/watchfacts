services:
  watchfacts-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-watchfacts:local}
    container_name: watchfacts-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      HEADLESS: "${HEADLESS:-true}"
      WATCHFACTS_URL: "${WATCHFACTS_URL:-https://watchfacts.com/simon-match-making}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    shm_size: "1gb"
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "app.main", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["python", "-m", "app.main"]

  watchfacts-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-watchfacts:local}
    container_name: watchfacts-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8765:8766"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    shm_size: "1gb"
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8766/healthz', timeout=5); payload = json.load(response); raise SystemExit(0 if response.status == 200 and payload.get('status') == 'ok' else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["python", "-m", "app.web_server"]
