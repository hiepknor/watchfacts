services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: watchfacts-bot:local
    container_name: watchfacts-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      HEADLESS: "${HEADLESS:-true}"
      ENABLE_CRAWL4AI: "${ENABLE_CRAWL4AI:-true}"
      WATCHFACTS_URL: "${WATCHFACTS_URL:-https://watchfacts.com/simon-match-making}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    shm_size: "1gb"
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "app.main", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    command: ["python", "-m", "app.main"]

  watchfacts-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: watchfacts-bot:local
    container_name: watchfacts-mcp
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    shm_size: "1gb"
    init: true
    command: ["python", "-m", "app.mcp_server"]
