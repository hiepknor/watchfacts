name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          TARGET_SHA="${GITHUB_SHA:-HEAD}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "${BASE_SHA:-}" = "$ZERO_SHA" ] || [ -z "${BASE_SHA:-}" ]; then
              BASE_SHA="origin/${{ github.base_ref }}"
            fi

            if [ "${BASE_SHA:-}" != "origin/${{ github.base_ref }}" ]; then
              BASE_SHA="$(git merge-base HEAD "${BASE_SHA}")"
            fi

            if ! git rev-parse "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
              git fetch --depth=1 origin "${BASE_SHA}" || true
            fi

            git diff --check "${BASE_SHA}...${TARGET_SHA}"
          elif [ "${BEFORE_SHA:-$ZERO_SHA}" != "$ZERO_SHA" ] \
            && git rev-parse "${BEFORE_SHA:-$ZERO_SHA}^{commit}" >/dev/null 2>&1; then
            git diff --check "${BEFORE_SHA}..${TARGET_SHA}"
          else
            PARENT_SHA="$(git rev-parse --verify --quiet "${TARGET_SHA}^" || true)"
            if [ -n "$PARENT_SHA" ]; then
              git diff --check "${PARENT_SHA}..${TARGET_SHA}"
            else
              git diff-tree --check --no-commit-id -r "${TARGET_SHA}"
            fi
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python
        run: python -m compileall app scripts

      - name: Validate Docker Compose config
        shell: bash
        run: |
          set -eu
          if command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_BIN="docker-compose"
          else
            COMPOSE_BIN="docker compose"
          fi
          $COMPOSE_BIN -f docker-compose.yml -f docker-compose.watchfacts-mcp.yml config >/dev/null
