name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "${BASE_SHA}...HEAD"
          elif [ "$BEFORE_SHA" != "$ZERO_SHA" ]; then
            git diff --check "${BEFORE_SHA}..HEAD"
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python
        run: python -m compileall app scripts

      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.watchfacts-mcp.yml config >/dev/null
