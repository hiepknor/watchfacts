services:
  watchfacts-mcp:
    ports:
      - "127.0.0.1:8765:8765"
    networks:
      - default
      - hermes
      - openwa

networks:
  hermes:
    external: true
    name: ${HERMES_DOCKER_NETWORK:-hermes-network}
  openwa:
    external: true
    name: ${OPENWA_DOCKER_NETWORK:-openwa-network}
